<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コインパーキング料金・最大料金の税込・税抜スマート計算機</title>
    <style>
        :root {
            --primary-color: #1a237e;
            --primary-light: #534bae;
            --primary-dark: #000051;
            --accent-color: #ffca28;
            --accent-hover: #ffb300;
            --text-color: #333333;
            --text-light: #666666;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 80%);
            pointer-events: none;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 svg {
            fill: var(--accent-color);
            width: 32px;
            height: 32px;
        }

        header p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: 1.2fr 0.8fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            padding: 24px;
            height: fit-content;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
            padding-left: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* タブデザイン */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-light);
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group.row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .input-unit {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"],
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fafafa;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-light);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(83, 75, 174, 0.1);
        }

        .unit-label {
            position: absolute;
            right: 12px;
            color: var(--text-light);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .input-unit input {
            padding-right: 45px;
        }

        /* トグルスイッチ */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed var(--border-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* ラジオボタングループ */
        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .radio-label {
            display: block;
            text-align: center;
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + .radio-label {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        /* 結果表示スタイル */
        .result-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 2px solid var(--accent-color);
        }

        .result-time {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .result-price-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-price-main {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .result-price-main span {
            font-size: 1.5rem;
            font-weight: normal;
            margin-left: 4px;
        }

        .result-sub-prices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background-color: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .result-sub-prices div {
            display: flex;
            flex-direction: column;
        }

        .result-sub-prices span {
            font-weight: bold;
            color: #f1f5f9;
            font-size: 1.1rem;
        }

        /* 計算内訳 */
        .breakdown-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breakdown-list {
            list-style: none;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .breakdown-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .breakdown-list li:last-child {
            border-bottom: none;
        }

        .breakdown-value {
            font-weight: bold;
            color: var(--text-color);
            text-align: right;
        }

        /* 警告・エラー */
        .alert {
            background-color: #ffebee;
            color: var(--error-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #ffcdd2;
        }

        /* クイック加算ボタン */
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .quick-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            transition: background-color 0.2s;
        }

        .quick-btn:hover {
            background-color: #cbd5e1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-light);
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
        }

        /* ユーティリティ */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10,0,1,0,22,12,10,10,0,0,0,12,2Zm1,14H11V10H13Zm0-8H11V6h2Z"/>
            </svg>
            コインパーキング料金スマート計算機
        </h1>
        <p>駐車時間、時間単価、最大料金から税込・税抜の正しい支払料金を自動計算</p>
    </header>

    <div class="grid-layout">
        <!-- 入力エリア -->
        <div class="card">
            <div class="tabs">
                <div class="tab active" id="tab-datetime" onclick="switchTab('datetime')">日時から計算</div>
                <div class="tab" id="tab-duration" onclick="switchTab('duration')">駐車時間から計算</div>
            </div>

            <div id="alert-message" class="alert"></div>

            <!-- 日時指定での入力 -->
            <div id="content-datetime" class="tab-content active">
                <div class="form-group row">
                    <div>
                        <label for="entry-time">入庫日時</label>
                        <input type="datetime-local" id="entry-time">
                    </div>
                    <div>
                        <label for="exit-time">出庫日時</label>
                        <input type="datetime-local" id="exit-time">
                    </div>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="addHours(1)">+1時間</button>
                    <button class="quick-btn" onclick="addHours(3)">+3時間</button>
                    <button class="quick-btn" onclick="addHours(12)">+12時間</button>
                    <button class="quick-btn" onclick="addHours(24)">+24時間</button>
                </div>
            </div>

            <!-- 時間直接入力 -->
            <div id="content-duration" class="tab-content">
                <div class="form-group row">
                    <div>
                        <label for="duration-hours">駐車時間（時間）</label>
                        <div class="input-unit">
                            <input type="number" id="duration-hours" min="0" value="2">
                            <span class="unit-label">時間</span>
                        </div>
                    </div>
                    <div>
                        <label for="duration-minutes">駐車時間（分）</label>
                        <div class="input-unit">
                            <input type="number" id="duration-minutes" min="0" max="59" value="0">
                            <span class="unit-label">分</span>
                        </div>
                    </div>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 25px 0;">

            <!-- 通常料金設定 -->
            <div class="card-title">通常料金設定</div>
            <div class="form-group row">
                <div>
                    <label for="unit-time">基準時間</label>
                    <div class="input-unit">
                        <input type="number" id="unit-time" min="1" value="30">
                        <span class="unit-label">分</span>
                    </div>
                </div>
                <div>
                    <label for="unit-price">基準料金</label>
                    <div class="input-unit">
                        <input type="number" id="unit-price" min="0" value="200">
                        <span class="unit-label">円</span>
                    </div>
                </div>
            </div>

            <!-- 最大料金設定 -->
            <div class="switch-container">
                <span style="font-weight: bold; font-size: 0.95rem;">最大料金を適用する</span>
                <label class="switch">
                    <input type="checkbox" id="use-max-price" checked onchange="toggleMaxPriceSection()">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="max-price-section">
                <div class="form-group row">
                    <div>
                        <label for="max-price">最大料金</label>
                        <div class="input-unit">
                            <input type="number" id="max-price" min="0" value="1200">
                            <span class="unit-label">円</span>
                        </div>
                    </div>
                    <div>
                        <label for="max-price-hours">適用単位時間</label>
                        <div class="input-unit">
                            <input type="number" id="max-price-hours" min="1" value="24">
                            <span class="unit-label">時間</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="max-price-loop">適用方法</label>
                    <select id="max-price-loop">
                        <option value="loop">繰り返し適用する（24時間ごと等）</option>
                        <option value="once">1回のみ（以降は通常料金が加算）</option>
                    </select>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 25px 0;">

            <!-- 税金・端数設定 -->
            <div class="card-title">税・端数処理設定</div>
            <div class="form-group">
                <label>入力料金の税区分</label>
                <div class="radio-group">
                    <div>
                        <input type="radio" id="tax-type-in" name="tax-type" value="tax-in" checked>
                        <label for="tax-type-in" class="radio-label">税込で入力</label>
                    </div>
                    <div>
                        <input type="radio" id="tax-type-ex" name="tax-type" value="tax-ex">
                        <label for="tax-type-ex" class="radio-label">税抜で入力</label>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <div>
                    <label for="tax-rate">消費税率</label>
                    <div class="input-unit">
                        <input type="number" id="tax-rate" min="0" max="100" value="10">
                        <span class="unit-label">%</span>
                    </div>
                </div>
                <div>
                    <label for="rounding-method">消費税端数処理</label>
                    <select id="rounding-method">
                        <option value="floor">切り捨て</option>
                        <option value="round">四捨五入</option>
                        <option value="ceil">切り上げ</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div>
            <div class="result-box">
                <div class="result-time" id="res-total-time">駐車時間: 0分</div>
                <div class="result-price-title" id="res-tax-badge">お支払い金額（税込）</div>
                <div class="result-price-main" id="res-total-tax-in">¥0</div>
                <div class="result-sub-prices">
                    <div>
                        <span>税抜金額</span>
                        <span id="res-total-tax-ex">¥0</span>
                    </div>
                    <div>
                        <span>消費税額</span>
                        <span id="res-tax-amount">¥0</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="breakdown-title">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: var(--primary-color);">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                    料金計算の内訳
                </div>
                <ul class="breakdown-list" id="breakdown-list">
                    <!-- 動的に生成 -->
                </ul>
            </div>
        </div>
    </div>

    <footer>
        &copy; <span id="current-year"></span> コインパーキング料金スマート計算機. All Rights Reserved.
    </footer>
</div>

<script>
    // 定数と状態管理
    let activeTab = 'datetime';
    const storageKey = 'parking_calculator_state';

    // DOM要素の取得
    const elements = {
        entryTime: document.getElementById('entry-time'),
        exitTime: document.getElementById('exit-time'),
        durationHours: document.getElementById('duration-hours'),
        durationMinutes: document.getElementById('duration-minutes'),
        unitTime: document.getElementById('unit-time'),
        unitPrice: document.getElementById('unit-price'),
        useMaxPrice: document.getElementById('use-max-price'),
        maxPrice: document.getElementById('max-price'),
        maxPriceHours: document.getElementById('max-price-hours'),
        maxPriceLoop: document.getElementById('max-price-loop'),
        taxRate: document.getElementById('tax-rate'),
        roundingMethod: document.getElementById('rounding-method'),
        alertMessage: document.getElementById('alert-message'),
        resTotalTime: document.getElementById('res-total-time'),
        resTotalTaxIn: document.getElementById('res-total-tax-in'),
        resTotalTaxEx: document.getElementById('res-total-tax-ex'),
        resTaxAmount: document.getElementById('res-tax-amount'),
        resTaxBadge: document.getElementById('res-tax-badge'),
        breakdownList: document.getElementById('breakdown-list'),
        maxPriceSection: document.getElementById('max-price-section')
    };

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('current-year').textContent = new Date().getFullYear();
        setDefaultDates();
        loadState();
        toggleMaxPriceSection();
        calculate();

        // すべての入力項目にイベントリスナーを登録して自動計算
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                calculate();
                saveState();
            });
        });
    });

    // デフォルト日時の設定 (現在時刻と2時間後)
    function setDefaultDates() {
        const now = new Date();
        const twoHoursLater = new Date(now.getTime() + 2 * 60 * 60 * 1000);
        
        elements.entryTime.value = formatLocalDateTime(now);
        elements.exitTime.value = formatLocalDateTime(twoHoursLater);
    }

    // ローカルタイムゾーンに合わせたISOフォーマットの取得
    function formatLocalDateTime(date) {
        const offset = date.getTimezoneOffset();
        const localDate = new Date(date.getTime() - (offset * 60 * 1000));
        return localDate.toISOString().slice(0, 16);
    }

    // クイック日時追加
    function addHours(hours) {
        if (activeTab !== 'datetime') return;
        const entry = new Date(elements.entryTime.value);
        if (isNaN(entry.getTime())) return;
        const newExit = new Date(entry.getTime() + hours * 60 * 60 * 1000);
        elements.exitTime.value = formatLocalDateTime(newExit);
        calculate();
        saveState();
    }

    // タブ切り替え
    function switchTab(tabName) {
        activeTab = tabName;
        document.getElementById('tab-datetime').classList.toggle('active', tabName === 'datetime');
        document.getElementById('tab-duration').classList.toggle('active', tabName === 'duration');
        document.getElementById('content-datetime').classList.toggle('active', tabName === 'datetime');
        document.getElementById('content-duration').classList.toggle('active', tabName === 'duration');
        calculate();
        saveState();
    }

    // 最大料金セクションの表示・非表示
    function toggleMaxPriceSection() {
        if (elements.useMaxPrice.checked) {
            elements.maxPriceSection.classList.remove('hidden');
        } else {
            elements.maxPriceSection.classList.add('hidden');
        }
    }

    // 計算ロジック
    function calculate() {
        elements.alertMessage.style.display = 'none';
        let totalMinutes = 0;

        // 1. 駐車時間の算出
        if (activeTab === 'datetime') {
            const entry = new Date(elements.entryTime.value);
            const exit = new Date(elements.exitTime.value);

            if (isNaN(entry.getTime()) || !elements.entryTime.value) {
                showError("有効な入庫日時を入力してください。");
                return;
            }
            if (isNaN(exit.getTime()) || !elements.exitTime.value) {
                showError("有効な出庫日時を入力してください。");
                return;
            }
            if (exit <= entry) {
                showError("出庫日時は入庫日時より後の時間を設定してください。");
                return;
            }

            totalMinutes = Math.floor((exit.getTime() - entry.getTime()) / (1000 * 60));
        } else {
            const hrs = parseInt(elements.durationHours.value) || 0;
            const mins = parseInt(elements.durationMinutes.value) || 0;
            totalMinutes = (hrs * 60) + mins;

            if (totalMinutes <= 0) {
                showError("駐車時間を1分以上に設定してください。");
                return;
            }
        }

        // 2. 料金設定の取得とバリデーション
        const unitTime = parseInt(elements.unitTime.value) || 0;
        const unitPrice = parseInt(elements.unitPrice.value) || 0;

        if (unitTime <= 0) {
            showError("通常料金の基準時間は1分以上に設定してください。");
            return;
        }

        const useMax = elements.useMaxPrice.checked;
        const maxPrice = parseInt(elements.maxPrice.value) || 0;
        const maxHours = parseInt(elements.maxPriceHours.value) || 0;
        const maxLoop = elements.maxPriceLoop.value;

        if (useMax && (maxPrice <= 0 || maxHours <= 0)) {
            showError("最大料金、および適用単位時間は正しく設定してください。");
            return;
        }

        // 3. 料金計算（ベース計算）
        let basePrice = 0;
        const breakdown = [];

        // 駐車時間をフォーマット表示用に整形
        const displayDays = Math.floor(totalMinutes / (24 * 60));
        const displayHours = Math.floor((totalMinutes % (24 * 60)) / 60);
        const displayMins = totalMinutes % 60;
        let timeStr = "駐車時間: ";
        if (displayDays > 0) timeStr += `${displayDays}日 `;
        if (displayHours > 0 || displayDays > 0) timeStr += `${displayHours}時間 `;
        timeStr += `${displayMins}分（計 ${totalMinutes.toLocaleString()}分）`;
        elements.resTotalTime.textContent = timeStr;

        breakdown.push({ label: "駐車総時間", value: `${totalMinutes.toLocaleString()}分` });

        // 通常料金（最大料金なしの場合の料金）
        const normalPrice = Math.ceil(totalMinutes / unitTime) * unitPrice;

        if (!useMax) {
            basePrice = normalPrice;
            breakdown.push({ label: "通常料金計算", value: `${unitTime}分毎 ${unitPrice}円` });
            breakdown.push({ label: "適用計算回数", value: `${Math.ceil(totalMinutes / unitTime)}回` });
        } else {
            const maxMinutes = maxHours * 60;

            if (maxLoop === 'loop') {
                // 繰り返しあり
                const blocks = Math.floor(totalMinutes / maxMinutes);
                const remainingMinutes = totalMinutes % maxMinutes;
                
                let blockPrice = blocks * maxPrice;
                if (blocks > 0) {
                    breakdown.push({ label: `最大料金適用（${maxHours}時間ごと）`, value: `${maxPrice.toLocaleString()}円 × ${blocks}回` });
                }

                // 端数部分の計算
                let remainingPrice = 0;
                if (remainingMinutes > 0) {
                    const normalRemainingPrice = Math.ceil(remainingMinutes / unitTime) * unitPrice;
                    if (normalRemainingPrice > maxPrice) {
                        remainingPrice = maxPrice;
                        breakdown.push({ label: `端数時間（${remainingMinutes}分）`, value: `最大料金適用: ${maxPrice.toLocaleString()}円 (通常 ${normalRemainingPrice.toLocaleString()}円)` });
                    } else {
                        remainingPrice = normalRemainingPrice;
                        breakdown.push({ label: `端数時間（${remainingMinutes}分）`, value: `通常料金適用: ${remainingPrice.toLocaleString()}円 (${unitTime}分/${unitPrice}円)` });
                    }
                }
                basePrice = blockPrice + remainingPrice;

            } else {
                // 1回限り
                if (totalMinutes <= maxMinutes) {
                    // 最大料金適用時間内の場合
                    if (normalPrice > maxPrice) {
                        basePrice = maxPrice;
                        breakdown.push({ label: `最大料金適用（上限 ${maxHours}時間）`, value: `${maxPrice.toLocaleString()}円 (通常 ${normalPrice.toLocaleString()}円)` });
                    } else {
                        basePrice = normalPrice;
                        breakdown.push({ label: "通常料金適用", value: `${basePrice.toLocaleString()}円 (${unitTime}分/${unitPrice}円)` });
                    }
                } else {
                    // 最大料金適用時間を超えた場合（最初の1回のみ最大料金適用、以降は上限なしで通常料金加算）
                    const remainingMinutes = totalMinutes - maxMinutes;
                    const remainingPrice = Math.ceil(remainingMinutes / unitTime) * unitPrice;
                    basePrice = maxPrice + remainingPrice;

                    breakdown.push({ label: `初回最大料金（最初の${maxHours}時間）`, value: `${maxPrice.toLocaleString()}円` });
                    breakdown.push({ label: `以降の通常料金（${remainingMinutes}分）`, value: `${remainingPrice.toLocaleString()}円 (${unitTime}分/${unitPrice}円)` });
                }
            }
        }

        // 4. 税区分・消費税計算
        const isTaxInInput = document.getElementById('tax-type-in').checked;
        const taxRatePercent = parseFloat(elements.taxRate.value) || 0;
        const taxRate = taxRatePercent / 100;
        const rounding = elements.roundingMethod.value;

        let finalTaxIn = 0;
        let finalTaxEx = 0;
        let taxAmount = 0;

        if (isTaxInInput) {
            // 入力値が税込の場合
            finalTaxIn = basePrice;
            // 逆算：税抜 = 税込 / (1 + 税率)
            const rawTaxEx = finalTaxIn / (1 + taxRate);
            finalTaxEx = applyRounding(rawTaxEx, rounding);
            taxAmount = finalTaxIn - finalTaxEx;
            elements.resTaxBadge.textContent = "お支払い金額（税込）";
        } else {
            // 入力値が税抜の場合
            finalTaxEx = basePrice;
            const rawTax = finalTaxEx * taxRate;
            taxAmount = applyRounding(rawTax, rounding);
            finalTaxIn = finalTaxEx + taxAmount;
            elements.resTaxBadge.textContent = "お支払い金額（税込）";
        }

        // 5. 結果の画面反映
        elements.resTotalTaxIn.innerHTML = `¥${finalTaxIn.toLocaleString()}<span>(税込)</span>`;
        elements.resTotalTaxEx.textContent = `¥${finalTaxEx.toLocaleString()}`;
        elements.resTaxAmount.textContent = `¥${taxAmount.toLocaleString()} (${taxRatePercent}%)`;

        // 内訳リストのレンダリング
        renderBreakdown(breakdown, basePrice, isTaxInInput, taxRatePercent);
    }

    // 端数処理関数
    function applyRounding(val, method) {
        if (method === 'floor') return Math.floor(val);
        if (method === 'ceil') return Math.ceil(val);
        return Math.round(val);
    }

    // エラー表示
    function showError(message) {
        elements.alertMessage.textContent = message;
        elements.alertMessage.style.display = 'block';
        elements.resTotalTaxIn.textContent = "¥-";
        elements.resTotalTaxEx.textContent = "¥-";
        elements.resTaxAmount.textContent = "¥-";
        elements.resTotalTime.textContent = "駐車時間: -";
        elements.breakdownList.innerHTML = '<li style="color:var(--error-color);">正しい値を入力すると計算結果が表示されます。</li>';
    }

    // 内訳リストの描画
    function renderBreakdown(breakdown, basePrice, isTaxInInput, taxRate) {
        elements.breakdownList.innerHTML = '';
        breakdown.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${item.label}</span>
                <span class="breakdown-value">${item.value}</span>
            `;
            elements.breakdownList.appendChild(li);
        });

        // 基本料金小計
        const subtotalLi = document.createElement('li');
        subtotalLi.style.fontWeight = 'bold';
        subtotalLi.style.borderTop = '1px dashed var(--border-color)';
        subtotalLi.style.paddingTop = '12px';
        subtotalLi.innerHTML = `
            <span>計算基準金額 (${isTaxInInput ? '税込' : '税抜'})</span>
            <span class="breakdown-value" style="color:var(--primary-color)">¥${basePrice.toLocaleString()}</span>
        `;
        elements.breakdownList.appendChild(subtotalLi);
    }

    // 状態の保存 (localStorage)
    function saveState() {
        const state = {
            activeTab: activeTab,
            entryTime: elements.entryTime.value,
            exitTime: elements.exitTime.value,
            durationHours: elements.durationHours.value,
            durationMinutes: elements.durationMinutes.value,
            unitTime: elements.unitTime.value,
            unitPrice: elements.unitPrice.value,
            useMaxPrice: elements.useMaxPrice.checked,
            maxPrice: elements.maxPrice.value,
            maxPriceHours: elements.maxPriceHours.value,
            maxPriceLoop: elements.maxPriceLoop.value,
            taxType: document.querySelector('input[name="tax-type"]:checked').value,
            taxRate: elements.taxRate.value,
            roundingMethod: elements.roundingMethod.value
        };
        localStorage.setItem(storageKey, JSON.stringify(state));
    }

    // 状態の復元 (localStorage)
    function loadState() {
        const stateStr = localStorage.getItem(storageKey);
        if (!stateStr) return;

        try {
            const state = JSON.parse(stateStr);
            
            // タブの復元
            if (state.activeTab) {
                switchTab(state.activeTab);
            }

            // 各種値の復元
            if (state.entryTime) elements.entryTime.value = state.entryTime;
            if (state.exitTime) elements.exitTime.value = state.exitTime;
            if (state.durationHours) elements.durationHours.value = state.durationHours;
            if (state.durationMinutes) elements.durationMinutes.value = state.durationMinutes;
            if (state.unitTime) elements.unitTime.value = state.unitTime;
            if (state.unitPrice) elements.unitPrice.value = state.unitPrice;
            
            if (state.useMaxPrice !== undefined) {
                elements.useMaxPrice.checked = state.useMaxPrice;
            }
            if (state.maxPrice) elements.maxPrice.value = state.maxPrice;
            if (state.maxPriceHours) elements.maxPriceHours.value = state.maxPriceHours;
            if (state.maxPriceLoop) elements.maxPriceLoop.value = state.maxPriceLoop;
            
            if (state.taxType) {
                document.getElementById('tax-type-in').checked = (state.taxType === 'tax-in');
                document.getElementById('tax-type-ex').checked = (state.taxType === 'tax-ex');
            }
            if (state.taxRate) elements.taxRate.value = state.taxRate;
            if (state.roundingMethod) elements.roundingMethod.value = state.roundingMethod;

        } catch (e) {
            console.error("ローカルストレージのデータ復元に失敗しました。", e);
        }
    }
</script>

</body>
